# Qualitäts-Checks – siehe QUALITY.md, Abschnitt 3
# Einrichtung: pip install pre-commit && pre-commit install --hook-type pre-commit --hook-type commit-msg
# Versionen aktualisieren: pre-commit autoupdate
# Hinweis: terraform/tflint müssen lokal installiert sein; hadolint läuft über Docker.
#          Fehlt ein Tool lokal, einzelnen Hook überspringen: SKIP=tflint git commit ...  (CI prüft trotzdem)

default_install_hook_types: [pre-commit, commit-msg]

repos:
  # Allgemeine Hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=5000]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]

  # Secrets
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  # Dockerfiles
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker

  # Terraform (IaC)
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.92.0
    hooks:
      - id: terraform_fmt
      - id: terraform_tflint

  # Shell-Skripte
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck

  # Commit-Messages nach Conventional Commits
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, infra, test, chore, refactor, ci]
