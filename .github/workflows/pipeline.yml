# CI/CD-Pipeline: Test → Build + Scan → Staging → (Freigabe) → Prod
# Einrichtung der GitHub-Einstellungen: docs/runbook/github-setup.md
name: pipeline

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # TODO: an den Stack des Servers anpassen (z. B. setup-java + mvn test, setup-node + npm test, setup-python + pytest)
      - name: Unit-Tests
        run: echo "TODO - Tests des Labyrinth-Servers ausführen"

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Image-Name bestimmen (GHCR verlangt Kleinbuchstaben)
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/labyrinth-server" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Image bauen (lokal, für Scan)
        uses: docker/build-push-action@v6
        with:
          context: app
          file: app/Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Security-Scan (Trivy) – bricht bei kritischen Lücken ab (Ziel 5)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.54.1 image --exit-code 1 --severity CRITICAL --ignore-unfixed \
            "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"

      - name: Bei GHCR anmelden
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image pushen
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: app
          file: app/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:main
          cache-from: type=gha

  deploy-staging:
    if: github.event_name == 'push'
    needs: build
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      image: ${{ needs.build.outputs.image }}
      tag: ${{ needs.build.outputs.tag }}
    secrets: inherit
    permissions:
      contents: read
      packages: read

  deploy-prod:
    needs: [build, deploy-staging]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production   # Environment mit "Required reviewers" → manuelle Freigabe
      image: ${{ needs.build.outputs.image }}
      tag: ${{ needs.build.outputs.tag }}
    secrets: inherit
    permissions:
      contents: read
      packages: read
